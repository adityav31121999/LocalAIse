name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install -y cmake ninja

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Clone llama.cpp (pinned tag)
        working-directory: .
        run: git clone --depth 1 --branch b11678 https://github.com/ggml-org/llama.cpp vendor/llama.cpp

      - name: Build and stage llama-server bundle
        working-directory: .
        run: |
          npx tsx scripts/fetch-llama-server.ts ${{ matrix.os == 'windows-latest' && 'windows-x64' || 'linux-x64' }} cpu
          npx tsx scripts/stage-bundle.ts ${{ matrix.os == 'windows-latest' && 'windows-x64' || 'linux-x64' }}

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo clippy (warnings fail the build)
        run: cargo clippy --all-targets -- -D warnings

      - name: unit and integration tests
        run: cargo test

      - name: GPU crate ban (cargo-deny)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: deny check
        run: cargo deny check bans

  web:
    name: frontend · checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: bundle is CPU-only
        run: npx tsx scripts/check-bundle.ts dist
