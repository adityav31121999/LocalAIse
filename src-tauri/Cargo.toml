[package]
name = "LocalAIse"
version = "0.1.0"
description = "Private, local-first AI workspace for folders you own."
authors = ["localAIse"]
edition = "2021"
license = "MIT"
rust-version = "1.77"
default-run = "LocalAIse"

[[bin]]
name = "rag_eval"
path = "src/bin/rag_eval.rs"

[[bin]]
name = "reindex_testproj"
path = "src/bin/reindex_testproj.rs"

[[bin]]
name = "clean_index"
path = "src/bin/clean_index.rs"

[[bin]]
name = "search_phrases"
path = "src/bin/search_phrases.rs"

[lib]
name = "localaise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Structured logging. In dev the log lines land in the terminal that runs
# `npm start`; file output covers release builds, where there is no console.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
# Mostly localhost calls to llama-server; the GPU build installer also
# downloads the official prebuilt llama.cpp archives from GitHub, which needs
# TLS. No proxies, no mTLS.
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "stream", "rustls-tls"] }
# Timers for polling the server and for the request timeouts.
tokio = { version = "1", features = ["time"] }
# Stream utilities for model download progress tracking.
futures-util = "0.3"
# The chat agent loop: LangChain tools agent pointed at the local llama-server.
langchain-rust = "7"
# Evaluation harness
async-trait = "0.1"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
# Stream combinators the agent event loop needs; futures-util alone is not enough.
futures = "0.3"
# The GPU build installer: GitHub archives unzip or untar into the app's
# data dir. sha2 verifies the digest GitHub publishes for every release asset.
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
dom_smoothie = "0.18"
htmd = "0.1"
pdf-extract = "0.12"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
fastembed = "4"

# Reading the display-adapter class keys to get real VRAM sizes.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
