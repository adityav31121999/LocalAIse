[package]
name = "LocalAIse"
version = "0.1.0"
description = "Private, local-first AI workspace for folders you own."
authors = ["localAIse"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.77"

[lib]
name = "localaise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
# Mostly localhost calls to llama-server; the GPU build installer also
# downloads the official prebuilt llama.cpp archives from GitHub, which needs
# TLS. No proxies, no mTLS.
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "stream", "rustls-tls"] }
# Timers for polling the server and for the request timeouts.
tokio = { version = "1", features = ["time"] }
# Stream utilities for model download progress tracking.
futures-util = "0.3"
# The GPU build installer: GitHub archives unzip or untar into the app's
# data dir. sha2 verifies the digest GitHub publishes for every release asset.
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.10"

# Reading the display-adapter class keys to get real VRAM sizes.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
